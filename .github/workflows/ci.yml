name: build deploy and test

on:
  pull_request:
    branches:
      - develop
      - develop-cicd-trial
  push:
    branches:
      - develop
      - develop-cicd-trial
  workflow_dispatch:

concurrency:
  group: adapt-authoring-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '18'
  STUDIO_E2E_REPO: Laerdal-Medical/adapt-studio-e2e-test
  STUDIO_E2E_WORKFLOW: playwright.yml
  STUDIO_E2E_BRANCH: main

jobs:
  check-studio-e2e-secret:
    name: check E2E token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      # secrets context can't be used directly in a job-level `if:`, so resolve it here first
      - id: check
        env:
          STUDIO_E2E_TOKEN: ${{ secrets.STUDIO_E2E_TOKEN }}
        run: |
          if [ -n "${STUDIO_E2E_TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    name: build (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        # root package-lock.json is out of sync with package.json (version mismatches) - npm ci rejects that, npm install tolerates it
        run: npm install --ignore-scripts

      - name: Run backend CI tests
        run: ./node_modules/.bin/mocha ./test/storyboard.commentStatus.js ./test/storyboard.import.smoke.js

  new-ui-tests:
    name: build (new UI)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # no package-lock.json in new-ui-source - omit cache so it doesn't fall back to caching against the root lockfile

      - name: Update npm
        # Node 18 ships npm 10.8.2, which has a known optional-dependency native-binding bug (npm/cli#4828).
        run: npm install -g npm@10.9.4

      - name: Install new UI dependencies
        working-directory: new-ui-source
        # no package-lock.json committed here (platform-specific native binary, see new-ui-source/.gitignore), so npm ci would fail.
        # Also force a clean install dir to avoid npm's known optional-dependency native-binding bug (npm/cli#4828).
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Run new UI tests
        working-directory: new-ui-source
        run: npm test

  e2e-studio:
    name: E2E tests (pre-deploy gate)
    needs:
      - check-studio-e2e-secret
      - backend-tests
      - new-ui-tests
    # A pull request only runs the build jobs; without the token the gate is skipped, so nothing deploys
    if: ${{ github.event_name != 'pull_request' && needs.check-studio-e2e-secret.outputs.has_token == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      passed: ${{ steps.results.outputs.passed }}
      e2e_passed: ${{ steps.results.outputs.e2e_passed }}
      e2e_failed: ${{ steps.results.outputs.e2e_failed }}
      e2e_skipped: ${{ steps.results.outputs.e2e_skipped }}
      e2e_broken: ${{ steps.results.outputs.e2e_broken }}
      e2e_total: ${{ steps.results.outputs.e2e_total }}

    steps:
      - name: Start Studio E2E tests
        id: trigger
        env:
          STUDIO_E2E_TOKEN: ${{ secrets.STUDIO_E2E_TOKEN }}
        run: |
          set -euo pipefail

          dispatch_time=$(date -u +%s)

          # Success is HTTP 204. Any other status prints GitHub's message (bad or unapproved token, missing Actions permission, no workflow_dispatch trigger).
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${STUDIO_E2E_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${STUDIO_E2E_REPO}/actions/workflows/${STUDIO_E2E_WORKFLOW}/dispatches" \
            -d "{\"ref\":\"${STUDIO_E2E_BRANCH}\"}")

          if [ "$status" != "204" ]; then
            echo "::error::Dispatching ${STUDIO_E2E_WORKFLOW} on ${STUDIO_E2E_REPO}@${STUDIO_E2E_BRANCH} failed with HTTP ${status}: $(jq -r '.message // empty' response.json 2>/dev/null || true)"
            exit 1
          fi

          echo "dispatch_time=${dispatch_time}" >> "$GITHUB_OUTPUT"

      - name: Wait for Studio E2E tests
        id: wait
        env:
          STUDIO_E2E_TOKEN: ${{ secrets.STUDIO_E2E_TOKEN }}
          DISPATCH_TIME: ${{ steps.trigger.outputs.dispatch_time }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 90); do
            response=$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${STUDIO_E2E_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${STUDIO_E2E_REPO}/actions/workflows/${STUDIO_E2E_WORKFLOW}/runs?branch=${STUDIO_E2E_BRANCH}&event=workflow_dispatch&per_page=20")

            # the newest run created after the dispatch
            run=$(jq -c --argjson cutoff "$DISPATCH_TIME" '
              [.workflow_runs[] | select((.created_at | fromdateiso8601) >= $cutoff)]
              | sort_by(.created_at) | last // empty
            ' <<< "$response")

            if [ -n "$run" ]; then
              run_id=$(jq -r '.id' <<< "$run")
              run_url=$(jq -r '.html_url' <<< "$run")
              if [ "${announced_id:-}" != "$run_id" ]; then
                echo "Studio E2E run: ${run_url}"
                announced_id="$run_id"
              fi

              if [ "$(jq -r '.status' <<< "$run")" = "completed" ]; then
                conclusion=$(jq -r '.conclusion // ""' <<< "$run")
                {
                  echo "e2e_run_id=${run_id}"
                  echo "e2e_run_url=${run_url}"
                  echo "e2e_conclusion=${conclusion}"
                } >> "$GITHUB_OUTPUT"
                echo "Studio E2E run finished with conclusion: ${conclusion}"
                exit 0
              fi
            fi

            sleep 20
          done

          echo "::error::Timed out waiting for the Studio E2E run to finish"
          exit 1

      # Developers cannot open the Studio E2E repository, so its Playwright output is copied here, one line per test like the E2E job of the framework-plugins pipeline.
      - name: Run Playwright tests for studioTests (copied from the E2E run)
        id: results
        if: ${{ always() && steps.wait.outputs.e2e_run_id != '' }}
        env:
          STUDIO_E2E_TOKEN: ${{ secrets.STUDIO_E2E_TOKEN }}
          E2E_RUN_ID: ${{ steps.wait.outputs.e2e_run_id }}
          E2E_RUN_URL: ${{ steps.wait.outputs.e2e_run_url }}
          E2E_CONCLUSION: ${{ steps.wait.outputs.e2e_conclusion }}
        run: |
          echo "The Studio E2E tests ran in the Studio E2E repository (${E2E_RUN_URL}). This is their output."
          set +e
          api="https://api.github.com/repos/${STUDIO_E2E_REPO}"
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${STUDIO_E2E_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          # The Playwright step of the E2E run. Lines that look like workflow commands are indented so they stay plain text.
          curl -fsS "${auth[@]}" "${api}/actions/runs/${E2E_RUN_ID}/jobs?per_page=100" > jobs.json
          : > tests.txt
          for job_id in $(jq -r '.jobs[] | select(any(.steps[]?; (.name // "") | startswith("Run Playwright tests"))) | .id' jobs.json 2>/dev/null); do
            curl -fsSL "${auth[@]}" -o job.log "${api}/actions/jobs/${job_id}/logs" || continue
            awk '/##\[group\]Run npx playwright test/ {hdr=1; next} hdr && /##\[endgroup\]/ {hdr=0; on=1; next} on && /##\[group\]/ {exit} on' job.log \
              | sed -E 's/^[0-9T:.-]+Z //; s/\x1b\[[0-9;]*m//g; s/\r$//; s/^(##\[|::)/ \1/' | tail -n 5000 >> tests.txt
          done
          if [ -s tests.txt ]; then
            cat tests.txt
          else
            echo "::warning::The Playwright output of the E2E run could not be read"
          fi

          # Counts from the Allure summary, the same numbers the E2E repo's own report uses
          : > counts.md
          art_id=$(curl -fsS "${auth[@]}" "${api}/actions/runs/${E2E_RUN_ID}/artifacts?per_page=100" \
            | jq -r '[.artifacts[] | select(.name == "allure-report" and (.expired | not))] | first | .id // empty')
          if [ -n "$art_id" ] && curl -fsSL "${auth[@]}" -o allure.zip "${api}/actions/artifacts/${art_id}/zip" && unzip -p allure.zip widgets/summary.json > summary.json; then
            for k in passed failed skipped broken total; do
              echo "e2e_${k}=$(jq -r ".statistic.${k}" summary.json)" >> "$GITHUB_OUTPUT"
            done
            jq -r '"| Passed | Failed | Skipped | Broken | Total |\n|---|---|---|---|---|\n| \(.statistic.passed) | \(.statistic.failed) | \(.statistic.skipped) | \(.statistic.broken) | \(.statistic.total) |"' summary.json > counts.md
          fi

          # Playwright prints the failure details from "1)" on, so show them on their own in the run summary
          awk '/^[[:space:]]+1\) \[/ {f=1} f' tests.txt | head -n 300 > failures.txt
          {
            echo "### Studio E2E tests"
            cat counts.md
            if [ -s failures.txt ]; then
              echo "<details open><summary>Failing tests</summary>"
              echo
              echo '```'
              cat failures.txt
              echo '```'
              echo "</details>"
            fi
            echo
            echo "Every test is listed in the job log, step \"Run Playwright tests for studioTests (copied from the E2E run)\". The run itself is in the Studio E2E repository (access needed): ${E2E_RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$E2E_CONCLUSION" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The Studio E2E tests did not pass (conclusion: ${E2E_CONCLUSION}). The failing tests are listed above."
            exit 1
          fi

  # Merge to the deploy branch is separate from deploying: this job only runs once the build and the E2E gate pass.
  # A skipped gate (e.g. no STUDIO_E2E_TOKEN) skips this job, so it can never deploy ungated.
  # It is also skipped until the repository variable STUDIO_DEV_SSH_HOST exists, so merging this workflow is safe before the server is set up.
  deploy-dev:
    name: deploy to dev (SSH)
    needs:
      - backend-tests
      - new-ui-tests
      - e2e-studio
    if: ${{ needs.e2e-studio.outputs.passed == 'true' && vars.STUDIO_DEV_SSH_HOST != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', vars.STUDIO_DEPLOY_BRANCH || 'develop') }}
    # GitHub-hosted runners usually can't reach a dev server's SSH port: set STUDIO_DEPLOY_RUNNER to a self-hosted runner label inside the network.
    runs-on: ${{ vars.STUDIO_DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    concurrency:
      group: adapt-studio-deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ vars.STUDIO_DEV_SSH_HOST }}
      SSH_USER: ${{ vars.STUDIO_DEV_SSH_USER }}
      SSH_PORT: ${{ vars.STUDIO_DEV_SSH_PORT || '22' }}
      SSH_KNOWN_HOSTS: ${{ vars.STUDIO_DEV_SSH_KNOWN_HOSTS }}
      DEPLOY_COMMAND: ${{ vars.STUDIO_DEV_DEPLOY_COMMAND }}
      HEALTH_URL: ${{ vars.STUDIO_DEV_HEALTH_URL }}

    steps:
      - name: Check deploy settings
        env:
          SSH_KEY: ${{ secrets.STUDIO_DEV_SSH_KEY }}
        run: |
          missing=0
          need() { echo "::error::Missing $1"; missing=1; }
          [ -n "${SSH_USER:-}" ] || need "repository variable STUDIO_DEV_SSH_USER"
          [ -n "${SSH_KNOWN_HOSTS:-}" ] || need "repository variable STUDIO_DEV_SSH_KNOWN_HOSTS"
          [ -n "${DEPLOY_COMMAND:-}" ] || need "repository variable STUDIO_DEV_DEPLOY_COMMAND"
          [ -n "${SSH_KEY:-}" ] || need "repository secret STUDIO_DEV_SSH_KEY"
          exit "$missing"

      - name: Run deploy command on the dev server (SSH)
        env:
          SSH_KEY: ${{ secrets.STUDIO_DEV_SSH_KEY }}
        run: |
          set -euo pipefail

          key="${RUNNER_TEMP}/deploy_key"
          known_hosts="${RUNNER_TEMP}/known_hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          (umask 077; printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key")
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts"

          # set -e makes a failing step fail the deploy; the script travels base64-encoded so any login shell and any quoting works on the server
          cmd=$(printf '%s' "$DEPLOY_COMMAND" | tr -d '\r')
          script=$(printf 'set -e\nexport DEPLOY_SHA=%s\n%s\n' "$GITHUB_SHA" "$cmd")
          payload=$(printf '%s' "$script" | base64 -w0)

          # bash -l loads the deploy user's profile (PATH for node, pm2)
          ssh -i "$key" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            "${SSH_USER}@${SSH_HOST}" "bash -lc \"\$(printf %s '${payload}' | base64 -d)\""

      - name: Health check
        if: ${{ env.HEALTH_URL != '' }}
        run: curl -fsS --retry 10 --retry-delay 15 --retry-all-errors --max-time 30 "$HEALTH_URL" > /dev/null

  notify-teams:
    name: notify Teams
    needs:
      - check-studio-e2e-secret
      - backend-tests
      - new-ui-tests
      - e2e-studio
      - deploy-dev
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', vars.STUDIO_DEPLOY_BRANCH || 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      BUILD_RESULT: ${{ needs.backend-tests.result == 'success' && needs.new-ui-tests.result == 'success' && 'success' || 'failure' }}
      HAS_TOKEN: ${{ needs.check-studio-e2e-secret.outputs.has_token }}
      E2E_RESULT: ${{ needs.e2e-studio.result }}
      E2E_PASSED_FLAG: ${{ needs.e2e-studio.outputs.passed }}
      DEPLOY_RESULT: ${{ needs.deploy-dev.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BRANCH: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      E2E_PASSED: ${{ needs.e2e-studio.outputs.e2e_passed }}
      E2E_FAILED: ${{ needs.e2e-studio.outputs.e2e_failed }}
      E2E_SKIPPED: ${{ needs.e2e-studio.outputs.e2e_skipped }}
      E2E_BROKEN: ${{ needs.e2e-studio.outputs.e2e_broken }}
      E2E_TOTAL: ${{ needs.e2e-studio.outputs.e2e_total }}
    steps:
      - name: Send Teams notification
        run: |
          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "::notice::TEAMS_WEBHOOK_URL is not set, so no Teams message was sent"
            exit 0
          fi

          label() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "🚫 Cancelled" ;;
              *) echo "⚪ Skipped" ;;
            esac
          }

          build="$(label "$BUILD_RESULT")"

          e2e="$(label "$E2E_RESULT")"
          if [ "$E2E_RESULT" = "skipped" ] && [ "$HAS_TOKEN" = "false" ]; then
            e2e="⚪ Skipped (no E2E token)"
          fi

          deploy="$(label "$DEPLOY_RESULT")"
          [ "$DEPLOY_RESULT" = "success" ] && deploy="✅ Deployed"
          [ "$DEPLOY_RESULT" = "skipped" ] && deploy="⚪ Not run"

          # Title colour: red if anything failed, green if the build and the E2E tests passed, amber otherwise (e.g. no E2E token)
          color="Warning"
          if [ "$BUILD_RESULT" = "failure" ] || [ "$E2E_RESULT" = "failure" ] || [ "$E2E_RESULT" = "cancelled" ] || [ "$DEPLOY_RESULT" = "failure" ]; then
            color="Attention"
          elif [ "$BUILD_RESULT" = "success" ] && [ "$E2E_PASSED_FLAG" = "true" ]; then
            color="Good"
          fi

          subject=$(printf '%s' "${COMMIT_MESSAGE:-}" | head -n 1)
          commit="${COMMIT:0:7}${subject:+ - ${subject:0:80}}"

          # The link opens the test output of the E2E job (its "Run Playwright tests" step); without an E2E job it opens the run page
          link="$RUN_URL"
          anchor=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            | jq -r '[.jobs[] | select(.name == "E2E tests (pre-deploy gate)" and .conclusion != "skipped")] | first | select(. != null)
                     | "\(.id)#step:\([.steps[] | select(.name | startswith("Run Playwright tests"))] | (first // {number: 1}) | .number):1"' 2>/dev/null) || anchor=""
          [ -n "$anchor" ] && link="${RUN_URL}/job/${anchor}"

          jq -n \
            --arg color "$color" --arg url "$link" --arg branch "$BRANCH" --arg commit "$commit" \
            --arg build "$build" --arg e2e "$e2e" --arg deploy "$deploy" \
            --arg passed "${E2E_PASSED:-}" --arg failed "${E2E_FAILED:-}" \
            --arg skipped "${E2E_SKIPPED:-}" --arg broken "${E2E_BROKEN:-}" --arg total "${E2E_TOTAL:-}" '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard", version: "1.4",
                  body: (
                    [
                      {type: "TextBlock", size: "Large", weight: "Bolder", color: $color, text: "🚀 Adapt Studio CI/CD Results"},
                      {type: "TextBlock", wrap: true, size: "Medium", weight: "Bolder", color: "Dark", text: ("[🔍 View E2E test results (GitHub Actions)](" + $url + ")")},
                      {type: "FactSet", facts: [
                        {title: "Branch:", value: $branch},
                        {title: "Commit:", value: $commit},
                        {title: "Build:", value: $build},
                        {title: "E2E tests:", value: $e2e},
                        {title: "Deploy to dev:", value: $deploy}
                      ]}
                    ]
                    + (if $total != "" then [
                        {type: "TextBlock", weight: "Bolder", spacing: "Medium", text: "Studio E2E results"},
                        {type: "FactSet", facts: [
                          {title: "✅ Passed:", value: $passed},
                          {title: "❌ Failed:", value: $failed},
                          {title: "⚠ Skipped:", value: $skipped},
                          {title: "💥 Broken:", value: $broken},
                          {title: "📊 Total:", value: $total}
                        ]}
                      ] else [] end)
                  )
                }
              }]
            }' > card.json

          # A broken webhook must not turn a green pipeline red
          curl -sS -f -X POST "$TEAMS_WEBHOOK_URL" -H "Content-Type: application/json" -d @card.json \
            || echo "::warning::The Teams webhook rejected the message. Check that the TEAMS_WEBHOOK_URL secret is still valid."
